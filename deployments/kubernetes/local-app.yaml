apiVersion: v1
kind: Namespace
metadata:
  name: vantrel-data
  labels:
    app.kubernetes.io/part-of: vantrel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: questdb
  namespace: vantrel-data
  labels:
    app.kubernetes.io/name: questdb
    app.kubernetes.io/part-of: vantrel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: questdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: questdb
        app.kubernetes.io/part-of: vantrel
    spec:
      containers:
        - name: questdb
          image: docker.io/questdb/questdb:10.0.1
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: questdb
  namespace: vantrel-data
  labels:
    app.kubernetes.io/name: questdb
    app.kubernetes.io/part-of: vantrel
spec:
  selector:
    app.kubernetes.io/name: questdb
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-pipeline
  namespace: vantrel-data
  labels:
    app.kubernetes.io/name: local-pipeline
    app.kubernetes.io/part-of: vantrel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-pipeline
        app.kubernetes.io/part-of: vantrel
    spec:
      containers:
        - name: app
          image: localhost/vantrel-local-pipeline:dev
          imagePullPolicy: IfNotPresent
          args:
            - -serve
            - -addr
            - :8080
            - -questdb
            - http://questdb:9000
            - -schema
            - /app/contracts/questdb/market_observations.sql
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: local-pipeline
  namespace: vantrel-data
  labels:
    app.kubernetes.io/name: local-pipeline
    app.kubernetes.io/part-of: vantrel
spec:
  selector:
    app.kubernetes.io/name: local-pipeline
  ports:
    - name: http
      port: 8080
      targetPort: http
