{{- if .Values.questdb.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questdb-data
  namespace: {{ .Values.questdb.namespace }}
  labels:
    app.kubernetes.io/name: questdb
    app.kubernetes.io/part-of: vantrel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.questdb.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: questdb
  namespace: {{ .Values.questdb.namespace }}
  labels:
    app.kubernetes.io/name: questdb
    app.kubernetes.io/part-of: vantrel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: questdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: questdb
        app.kubernetes.io/part-of: vantrel
    spec:
      containers:
        - name: questdb
          image: {{ .Values.questdb.image }}
          ports:
            - name: http
              containerPort: 9000
            - name: health
              containerPort: 9003
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/questdb
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: questdb-data
---
apiVersion: v1
kind: Service
metadata:
  name: questdb
  namespace: {{ .Values.questdb.namespace }}
  labels:
    app.kubernetes.io/name: questdb
    app.kubernetes.io/part-of: vantrel
spec:
  selector:
    app.kubernetes.io/name: questdb
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: health
      port: 9003
      targetPort: health
{{- end }}
