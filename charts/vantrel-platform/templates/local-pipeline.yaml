{{- if .Values.localPipeline.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-pipeline
  namespace: {{ .Values.localPipeline.namespace }}
  labels:
    app.kubernetes.io/name: local-pipeline
    app.kubernetes.io/part-of: vantrel
spec:
  replicas: {{ .Values.localPipeline.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: local-pipeline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-pipeline
        app.kubernetes.io/part-of: vantrel
    spec:
      containers:
        - name: app
          image: {{ .Values.localPipeline.image }}
          imagePullPolicy: {{ .Values.localPipeline.imagePullPolicy }}
          args:
            - -serve
            - -addr
            - :8080
            - -questdb
            - http://questdb:9000
            - -schema
            - /app/contracts/questdb/market_observations.sql
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: local-pipeline
  namespace: {{ .Values.localPipeline.namespace }}
  labels:
    app.kubernetes.io/name: local-pipeline
    app.kubernetes.io/part-of: vantrel
spec:
  selector:
    app.kubernetes.io/name: local-pipeline
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
